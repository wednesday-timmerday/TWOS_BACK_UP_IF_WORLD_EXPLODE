name: Build & Upload Game

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pygame pypresence Pillow numpy opencv-python pyglet aiohttp websockets pyinstaller

      # ---------------- WINDOWS BUILD ----------------
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --noconfirm ^
          --clean ^
          --distpath dist/windows ^
          --add-data "cutscenes;cutscenes" ^
          --add-data "music;music" ^
          --add-data "sprites;sprites" ^
          --add-data "worlds;worlds" ^
          --add-data "icon;icon" ^
          --add-data "ui;ui" ^
          --add-data "interactables;interactables" ^
          --add-data "multiplayer;multiplayer" ^
          --collect-submodules sprites.physic_obj ^
          --name game ^
          main.py

      # ---------------- LINUX BUILD ----------------
      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm \
          --clean \
          --distpath dist/linux \
          --add-data "cutscenes:cutscenes" \
          --add-data "music:music" \
          --add-data "sprites:sprites" \
          --add-data "worlds:worlds" \
          --add-data "icon:icon" \
          --add-data "ui:ui" \
          --add-data "interactables:interactables" \
          --add-data "multiplayer:multiplayer" \
          --collect-submodules sprites.physic_obj \
          --name game \
          main.py

      # ---------------- PREP WINDOWS ----------------
      - name: Verify Windows Build
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (!(Test-Path "dist\windows")) {
            Write-Error "Windows build missing!"
          }
          Get-ChildItem dist -Recurse

      # ---------------- BUTLER DOWNLOAD (WINDOWS) ----------------
      - name: Download Butler (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          for ($i=0; $i -lt 3; $i++) {
            try {
              curl -L -o butler.zip https://itch.io/butler/windows-amd64/LATEST/archive/default
              break
            } catch {
              Start-Sleep -Seconds 5
            }
          }

          Expand-Archive butler.zip -DestinationPath butler -Force
          Get-ChildItem butler

      # ---------------- BUTLER DOWNLOAD (LINUX) ----------------
      - name: Download Butler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L -o butler.zip https://itch.io/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d butler
          chmod +x butler/butler

      # ---------------- UPLOAD WINDOWS ----------------
      - name: Upload to itch (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          $butler = Join-Path $PWD "butler\butler.exe"

          if (Test-Path $butler) {
            & $butler login
            & $butler push "dist\windows" "twosgroup/twos-playtestig:windows" --userversion "${{ github.run_number }}"
          } else {
            Write-Error "butler.exe not found"
          }

      # ---------------- UPLOAD LINUX ----------------
      - name: Upload to itch (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler/butler login
          ./butler/butler push dist/linux "twosgroup/twos-playtestig:linux" --userversion "${{ github.run_number }}"