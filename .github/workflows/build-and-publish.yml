name: Build Windows and publish to itch

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --hidden-import=pytweening --collect-all=pytweening
          --add-data "cutscenes;cutscenes" --collect-submodules sprites.physic_obj
          --add-data "music;music" --add-data "sprites;sprites" --add-data "worlds;worlds"
          --add-data "icon;icon" --add-data "ui;ui" --add-data "interactables;interactables"
          --add-data "multiplayer;multiplayer" --add-data "songs;songs"
          --clean --name "windows" main.py

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          Expand-Archive butler.zip -DestinationPath butler
        shell: pwsh

      - name: Publish to itch.io
        run: |
          .\butler\butler.exe push dist/windows $env:ITCH_USER/$env:ITCH_GAME`:windows
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: twosgroup
          ITCH_GAME: twos-playtestig

      - name: Notify Discord
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: |
          $body = @{
            content = "<@&$env:DISCORD_ROLE_ID> NEW LANCER PLAYTEST!\nhttps://twosgroup.itch.io/twos-playtestig/"
            allowed_mentions = @{
              roles = @($env:DISCORD_ROLE_ID)
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod `
            -Uri $env:DISCORD_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body